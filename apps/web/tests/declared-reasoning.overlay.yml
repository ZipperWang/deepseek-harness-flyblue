# The fixture-less web scaffold registers no adapter, so the shipped
# deepseek-official default would be a route nothing serves. This scenario
# starts the default on its own declared reasoning model so the effort pane
# describes that model from the first open.
- id: agent-default-model
  config:
    provider: acme-gateway
    model: acme-think

# This scenario pins the reasoning-declaration contract to the native
# ui-model-selection menu; the shipped effort-slider row would replace that
# menu with a slider and change the picked-level interaction surface.
- id: effort-slider
  disabled: true
